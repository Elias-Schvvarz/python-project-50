[project]
name = "hexlet-code"
version = "0.1.0"
description = "Compares two configuration files and shows a difference."
readme = "README.md"
authors = [
    { name = "elias", email = "eliaschvvarz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gendiff = "hexlet_code.scripts.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["hexlet_code"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.coverage.report]
fail_under = 80
show_missing = true